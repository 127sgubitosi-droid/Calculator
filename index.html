<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>
<body onload="loading()">

<div class="calculator"></div>
<div class="greenScreen"></div>
<input type="text">

<div class="firstGrp"></div>
<button onclick="tap('(')">(</button>
<button onclick="tap(')')">)</button>
<button onclick="tap()">←</button>
<button onclick="tap()">→</button>
<button onclick="tap('%')">%</button>
<button onclick="tap('^')">^</button>

<div class="secondGrp"></div>
<button class="numbers" onclick="tap('7')">7</button>
<button class="numbers" onclick="tap('8')">8</button>
<button class="numbers" onclick="tap('9')">9</button>
<button class="numbers" onclick="tap('/')">/</button>
<button class="numbers" onclick="tap('4')">4</button>
<button class="numbers" onclick="tap('5')">5</button>
<button class="numbers" onclick="tap('6')">6</button>
<button class="numbers" onclick="tap('X')">X</button>
<button class="numbers" onclick="tap('-')">-</button>
<button class="numbers" onclick="tap('0')">0</button>
<button class="numbers" onclick="tap('.')">.</button>
<button class="numbers" onclick="tap('=')">=</button>
<button class="numbers" onclick="tap('+')">+</button>

</body>
</html>
